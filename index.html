<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0b1526" />

  <title>卷里山河，心头月色 · 雷姆主题随记</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" />
  <style>
/* ============================================================
   雷姆主题（Re:Zero · Rem）—— 本页只有这一套皮肤
   配色基础：Catppuccin Mocha（MIT, https://github.com/catppuccin/catppuccin）
   强调色换成雷姆的水蓝（sapphire #74c7ec）与发色浅蓝（lavender #b4befe）
   ============================================================ */
:root{
  color-scheme: dark;
  --night-0:#11111b;
  --night-1:#1e1e2e;
  --night-2:#181825;
  --panel: rgba(30,30,46,.84);
  --panel-solid: rgba(24,24,37,.95);
  --panel-border: rgba(116,199,236,.24);
  --panel-border-strong: rgba(116,199,236,.46);
  --text:#cdd6f4;
  --text-dim:#bac2de;
  --muted:#a6adc8;
  --accent:#74c7ec;
  --accent-soft:#b4befe;
  --accent-deep:#89b4fa;
  --on-accent:#11111b;
  --glow: rgba(116,199,236,.26);
  --card: rgba(205,214,244,.05);
  --card-hover: rgba(205,214,244,.09);
  --xiaohong:#f0475a;
  --bili:#009fd4;
  --github:#2f3644;
  --radius:16px;
  --serif:'Noto Serif SC','Songti SC','SimSun',serif;
  --sans:Inter,system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{min-height:100%}
body{
  margin:0;
  color:var(--text);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.7;
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(116,199,236,.18), transparent 62%),
    radial-gradient(760px 460px at 104% 2%, rgba(180,190,254,.12), transparent 58%),
    linear-gradient(165deg,var(--night-0) 0%, var(--night-1) 48%, var(--night-2) 100%);
  background-attachment:fixed;
}
/* 夜色里极淡的雪光，纯 CSS，不引外部图 */
body::before{
  content:'';
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(1.4px 1.4px at 18% 22%, rgba(205,214,244,.55), transparent 60%),
    radial-gradient(1.2px 1.2px at 62% 12%, rgba(205,214,244,.40), transparent 60%),
    radial-gradient(1.6px 1.6px at 84% 38%, rgba(180,190,254,.45), transparent 60%),
    radial-gradient(1.1px 1.1px at 34% 68%, rgba(205,214,244,.32), transparent 60%),
    radial-gradient(1.3px 1.3px at 74% 82%, rgba(205,214,244,.36), transparent 60%);
  opacity:.55;
  animation:snowDrift 28s ease-in-out infinite alternate;
}
@keyframes snowDrift{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-18px,0)}}
::selection{background:rgba(116,199,236,.32);color:#fff}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:rgba(17,17,27,.6)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(116,199,236,.5),rgba(137,180,250,.5));border-radius:999px;border:2px solid rgba(17,17,27,.6)}

a:focus-visible,button:focus-visible,[tabindex]:focus-visible{
  outline:2px solid var(--accent);outline-offset:3px;border-radius:8px;
}

/* ---------- 顶栏 ---------- */
.topbar{
  position:relative;z-index:2;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  max-width:1040px;margin:20px auto 0;padding:12px 18px;
  background:var(--panel);
  border:1px solid var(--panel-border);
  border-radius:18px;
  backdrop-filter:blur(14px) saturate(120%);
  box-shadow:0 18px 50px rgba(17,17,27,.55), inset 0 1px 0 rgba(205,214,244,.06);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-avatar{
  width:52px;height:52px;flex:0 0 auto;border-radius:50%;
  object-fit:cover;object-position:center 28%;
  background:radial-gradient(circle at 30% 25%, rgba(180,190,254,.30), rgba(17,17,27,.92));
  border:1px solid rgba(180,190,254,.5);
  padding:2px;
  box-shadow:0 0 0 4px rgba(116,199,236,.10), 0 8px 22px rgba(17,17,27,.5);
}
.topbar h1{margin:0;font-family:var(--serif);font-size:21px;line-height:1.25;letter-spacing:.02em;color:var(--text)}
.brand-sub{margin:2px 0 0;font-size:11px;letter-spacing:.20em;text-transform:uppercase;color:var(--muted)}
.links{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{
  padding:9px 15px;border-radius:999px;border:1px solid transparent;
  color:#fff;text-decoration:none;font-weight:700;font-size:13.5px;letter-spacing:.02em;
  transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
}
.btn.xiaohongshu{background:linear-gradient(180deg,#ff6b79,var(--xiaohong))}
.btn.bilibili{background:linear-gradient(180deg,#12b6ee,var(--bili))}
.btn.github{background:linear-gradient(180deg,#3a4252,var(--github));border-color:rgba(205,214,244,.18)}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px var(--glow);filter:brightness(1.06)}

/* ---------- 布局 ---------- */
.container{
  position:relative;z-index:1;
  display:grid;grid-template-columns:240px minmax(0,1fr);gap:26px;
  max-width:1040px;margin:18px auto 0;padding:0 18px 64px;align-items:flex-start;
}
main.content{min-width:0}

/* ---------- 雷姆立绘区 ---------- */
.hero{
  position:relative;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;
  margin-bottom:18px;padding:22px 24px;border-radius:18px;
  background:
    radial-gradient(520px 260px at 88% 10%, rgba(116,199,236,.20), transparent 70%),
    linear-gradient(140deg, rgba(30,30,46,.92), rgba(17,17,27,.92));
  border:1px solid var(--panel-border);
  box-shadow:0 20px 54px rgba(17,17,27,.5);
}
.hero::after{
  content:'';position:absolute;inset:6px;border-radius:13px;
  border:1px dashed rgba(180,190,254,.16);pointer-events:none;
}
.hero-kicker{margin:0 0 6px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:700}
.hero-quote{margin:0;font-family:var(--serif);font-size:21px;line-height:1.55;color:#fff}
.hero-quote span{display:block;margin-top:6px;font-family:var(--sans);font-size:13.5px;letter-spacing:.04em;color:var(--text-dim)}
.hero-desc{margin:12px 0 0;max-width:46ch;font-size:13.5px;color:var(--muted)}
.hero-rem{
  width:176px;height:auto;align-self:end;
  filter:drop-shadow(0 16px 30px rgba(17,17,27,.6)) drop-shadow(0 0 24px rgba(116,199,236,.18));
  animation:remFloat 6.5s ease-in-out infinite;
}
@keyframes remFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ---------- 目录 ---------- */
.toc{
  position:sticky;top:20px;align-self:start;
  max-height:calc(100vh - 64px);overflow:auto;
  padding:16px;border-radius:var(--radius);
  background:var(--panel);border:1px solid var(--panel-border);
  backdrop-filter:blur(12px);
  box-shadow:0 18px 44px rgba(17,17,27,.45);
}
.toc h2{
  display:flex;align-items:center;gap:8px;margin:0 0 12px;
  font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
}
.toc h2::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--glow)}
.toc-controls{display:flex;gap:8px;margin-bottom:12px}
.toc-controls .btn{
  flex:1;padding:7px 10px;border-radius:9px;cursor:pointer;
  font-size:12.5px;font-weight:600;letter-spacing:.02em;
  color:var(--accent-soft);background:rgba(205,214,244,.07);border:1px solid rgba(180,190,254,.18);
}
.toc-controls .btn:hover{background:rgba(116,199,236,.16);color:#fff;box-shadow:none;transform:none}
.toc-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2px}
.toc-list a{
  display:block;padding:8px 11px;border-radius:9px;border-left:2px solid transparent;
  color:var(--text-dim);text-decoration:none;font-size:13.5px;
  transition:background .18s ease,color .18s ease,border-color .18s ease;
}
.toc-list a:hover{background:rgba(116,199,236,.10);color:var(--text)}
.toc-list a.active{
  color:#fff;font-weight:600;border-left-color:var(--accent);
  background:linear-gradient(90deg, rgba(116,199,236,.22), rgba(116,199,236,.04));
}

/* ---------- 正文卡片 ---------- */
.section-main{
  padding:20px 22px;border-radius:18px;
  background:var(--panel);border:1px solid var(--panel-border);
  backdrop-filter:blur(10px);
  box-shadow:0 20px 54px rgba(17,17,27,.45), inset 0 1px 0 rgba(205,214,244,.05);
}
#stats{
  margin:0 0 16px;padding-bottom:14px;
  font-size:13px;letter-spacing:.02em;color:var(--muted);
  border-bottom:1px dashed rgba(180,190,254,.16);
}
#stats strong{color:var(--accent-soft);font-weight:700}

.category-section{margin-bottom:14px}
.category-section:last-child{margin-bottom:0}
.category-title{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:0;padding:12px 15px;border-radius:12px;cursor:pointer;
  font-family:var(--serif);font-size:16px;font-weight:700;color:var(--text);
  background:linear-gradient(135deg, rgba(116,199,236,.12), rgba(137,180,250,.10));
  border:1px solid rgba(137,180,250,.22);
  transition:background .2s ease, border-color .2s ease, box-shadow .2s ease;
}
.category-title:hover{
  border-color:var(--panel-border-strong);
  background:linear-gradient(135deg, rgba(116,199,236,.18), rgba(137,180,250,.14));
}
.category-title .toggle-hint{
  flex:0 0 auto;padding:2px 10px;border-radius:999px;white-space:nowrap;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;
  color:var(--accent);background:rgba(116,199,236,.12);
}
.category-title.expanded .toggle-hint{color:var(--muted);background:rgba(205,214,244,.06)}

.quotes-container{display:none;padding:12px 2px 4px}
.quotes-container.expanded{display:block;animation:reveal .26s ease both}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

.quote-item{
  position:relative;margin-bottom:10px;padding:14px 18px;border-radius:12px;
  background:var(--card);border:1px solid rgba(180,190,254,.10);
  border-left:3px solid rgba(116,199,236,.35);
  transition:transform .25s cubic-bezier(.4,0,.2,1), background .25s ease,
             border-color .25s ease, box-shadow .25s ease;
}
.quote-item:last-child{margin-bottom:0}
.quote-item:hover,.quote-item:focus-within{
  transform:translateX(6px);
  background:var(--card-hover);
  border-color:rgba(137,180,250,.28);
  border-left-color:var(--accent);
  box-shadow:0 10px 26px rgba(17,17,27,.45), 0 0 0 1px rgba(116,199,236,.10);
}
.quote-text{display:flex;gap:12px;align-items:flex-start}
.quote-number{
  flex:0 0 auto;width:26px;height:26px;line-height:26px;text-align:center;
  border-radius:9px;font-size:12px;font-weight:800;color:var(--on-accent);
  background:linear-gradient(135deg,var(--accent-soft),var(--accent));
  box-shadow:0 6px 16px rgba(116,199,236,.22);
  transition:transform .25s ease;
}
.quote-item:hover .quote-number{transform:scale(1.12) rotate(-4deg)}
.quote-content{flex:1;min-width:0;font-size:14.5px;line-height:1.85;color:var(--text-dim);white-space:pre-wrap}
.quote-item:hover .quote-content,.quote-item:focus-within .quote-content{color:var(--text)}
.quote-content p{margin:0 0 .6em}
.quote-content p:last-child{margin-bottom:0}
.quote-content a{color:var(--accent);text-decoration-color:rgba(116,199,236,.4)}
.quote-content strong{color:#fff}
.quote-content em{color:var(--accent-soft)}
.quote-content code{padding:.1em .35em;border-radius:4px;font-size:.92em;background:rgba(116,199,236,.12)}
.quote-content blockquote{margin:.6em 0;padding-left:12px;border-left:2px solid rgba(116,199,236,.4);color:var(--muted)}

/* ---------- 雷姆小助手（左下角） ---------- */
.rem-mascot{
  position:fixed;left:18px;bottom:18px;z-index:1200;
  display:flex;align-items:flex-end;gap:10px;
  max-width:min(300px, calc(100vw - 96px));
}
.rem-mascot img{
  width:64px;height:64px;border-radius:50%;cursor:pointer;flex:0 0 auto;
  object-fit:cover;object-position:center 28%;
  background:rgba(24,24,37,.92);border:1px solid rgba(180,190,254,.4);padding:2px;
  box-shadow:0 10px 28px rgba(17,17,27,.55), 0 0 0 4px rgba(116,199,236,.08);
  transition:transform .18s ease, box-shadow .18s ease;
}
.rem-mascot img:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(17,17,27,.6), 0 0 0 4px rgba(116,199,236,.16)}
.mascot-bubble{
  margin-bottom:6px;padding:10px 14px;border-radius:14px 14px 14px 4px;
  background:var(--panel-solid);border:1px solid var(--panel-border);
  color:var(--text-dim);font-size:12.5px;line-height:1.65;
  box-shadow:0 14px 34px rgba(17,17,27,.5);
  opacity:1;visibility:visible;
  transition:opacity .4s ease, visibility .4s;
}
.mascot-bubble.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
.mascot-bubble .jp{display:block;margin-bottom:2px;font-family:var(--serif);font-size:13px;color:var(--accent-soft)}
.mascot-bubble .ep{display:block;margin-top:4px;font-size:10.5px;letter-spacing:.1em;color:var(--muted);opacity:.8}

/* ---------- 回到顶部/底部 ---------- */
.page-jump{position:fixed;right:18px;bottom:18px;z-index:1200;display:flex;flex-direction:column;gap:10px}
.page-jump button{
  width:44px;height:44px;border-radius:14px;cursor:pointer;
  border:1px solid var(--panel-border);background:var(--panel-solid);
  color:var(--accent-soft);font-size:16px;font-weight:800;line-height:1;
  backdrop-filter:blur(10px);
  box-shadow:0 10px 26px rgba(17,17,27,.45);
  transition:transform .18s ease, color .18s ease, border-color .18s ease, box-shadow .18s ease;
}
.page-jump button:hover{
  transform:translateY(-2px);color:#fff;border-color:var(--panel-border-strong);
  box-shadow:0 14px 32px rgba(17,17,27,.55), 0 0 18px var(--glow);
}

/* ---------- 错误提示 ---------- */
.error{
  padding:16px 18px;border-radius:12px;
  color:#ffd2d7;background:rgba(255,90,106,.10);border:1px solid rgba(255,90,106,.34);
}
.error strong{color:#fff}

/* ---------- 响应式 ---------- */
@media (min-width:1500px){
  :root{--layout-gutter:max(32px, calc((100vw - 1520px)/2))}
  .topbar,.container{
    width:calc(100% - var(--layout-gutter) - var(--layout-gutter) - 360px);
    max-width:1160px;margin-left:var(--layout-gutter);margin-right:0;
  }
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-rem{
    position:fixed;right:var(--layout-gutter);top:50%;translate:0 -50%;
    width:340px;
    max-height:calc(100vh - 160px);object-fit:contain;
    pointer-events:none;
  }
}
@media (max-width:920px){
  .container{grid-template-columns:1fr;padding:0 14px 56px}
  .toc{position:relative;top:0;order:-1;max-height:none}
  .topbar{flex-direction:column;align-items:flex-start;gap:12px;margin:12px 14px 0;padding:12px 14px}
  .links{width:100%}
  .hero{grid-template-columns:1fr auto;gap:10px;padding:20px}
  .hero-rem{width:104px;align-self:end;justify-self:end}
  .quote-item:hover,.quote-item:focus-within{transform:none}
}
@media (max-width:640px){
  .brand-avatar{width:44px;height:44px}
  .topbar h1{font-size:18px}
  .hero-quote{font-size:18px}
  .section-main{padding:16px 14px}
  .rem-mascot{display:none}
  .btn{padding:8px 13px;font-size:13px}
}
/* 本地直开（file://）提示条 */
.file-note{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 14px;padding:9px 14px;border:1px dashed var(--panel-border-strong);border-radius:12px;background:var(--card);font-size:12.5px;color:var(--muted)}
.file-note[hidden]{display:none}
.file-note-pick{cursor:pointer;color:var(--accent);border-bottom:1px dashed currentColor}
.file-note-pick:focus-within{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
  </style>
</head>

    <main class="content">

        <span>本地直开 · 当前为内嵌快照。自动读取最新 MD 请双击「打开网页.cmd」。</span>

          <p class="hero-desc">蓝色长夜，雷姆就在旁边，陪你把读过、看过、哭过的那些片段再翻一遍。</p>

  <!-- marked v15.0.12 · MIT · 本地副本，离线可用 -->

1. - 2024.8.27感慨万千，无需过多的言语，在那个时候那个地点那个直播间有那么一群人，守着自己喜欢的主播看意义非凡的游戏。只知道在那个时刻，大圣死去，天命人奔赴，老猴指路，八戒嘴上虽说你配不上大师兄但是还是劝你保命要紧，真栗鼻头一红，潸然泪下，大家伙鼻头一酸，泪珠无声无息地滑落脸颊，静静地滴落在地板上，夜晚的静谧让人越发孤独与寂寞。不知这是第几次的无声落泪，尽管这是极度抑制住声音，抽出一张纸就只顾擤鼻涕，旁人若不知则以为感冒流涕，实则为掩盖泪眼朦胧，发红的双眼眼神坚毅又柔软。

   - 从前我鲁莽地认为，一本书没有读第二遍的必要，不是说我能够记忆多少书中的情节，能够永久地将这份情感保持在心间，但是，当下的我在写下这些个文字的时候，不论是《斗破苍穹》，还是《龙族》，亦或是《武动乾坤》，再看这些文字，写下这些感悟，已经不知是多少次的泪流满面，不知用纸巾擤了多少次鼻涕，不知去厕所用水冲洗了多少次脸庞，只为了不让旁人看出我早已以泪洗面。在天天的快节奏的生活中，我是用上课时间看小说，刚好昨天在宿舍把最后的尾巴看完。能够完完全全静下心来读书，为一个人物哭得泪流满面，甚至可以是撕心裂肺，这是我初高中所从未体会到的至深的真挚情感，这才是我真真切切体会到或者的意义的一环，这世间有这么多美好的情感等待我去感悟，这么多好书值得去为它哭泣，为它流泪，这么多电影、番，或许能带给我震撼，以感动。就比如《青春猪头少年之怀梦美少女》不论是小说还是剧场版，我都哭了。为什么要有这么多的善良和责任啊，“对不起……我并不想守护什么天地，也不想做什么救世主，可是，我想要你活着……”，当他们被赋予救世主的身份的时候，悲伤就会开始蔓延。林动努力地修炼着，遍体鳞伤的想要为自己的人接过所有的责任。当他发现最后还是不能如愿以偿时，悲痛欲绝。他最终在大千世界中一人独挡整个冰灵族取回欢欢残魂，复活了欢欢。但是，绘梨衣，仍旧躺在东京红井的石英玻璃之中……。由于欢欢的复活并不在同一本书中，而是在番外篇中，所以我仍然不能像对樱岛麻衣推开梓川呔太然后车祸死去然后呔太通过牧之原翔子穿越时间线去拯救樱岛麻衣而最后复活一样的态度，毕竟樱岛麻衣最后在不久后复活了。《武动乾坤》于2013年6月28日完结，但是番外篇在2020年05月07日才正式完结，应欢欢对于很多人来说足足有7年才回归，“欢欢……欢迎回家！”这句话是很多人青春的结束，足足7年……。我是一气呵成看完的，所以没有等待。眼泪干了，上传一下知乎……。现在在追《斗破苍穹》动漫，回家后打算着手追《武动乾坤》了。现在在看小说《大主宰》。打算把三部曲结束一下，同时也是为了再次看到萧炎和林动、**应欢欢**。十二点半了。《武动乾坤》小说结尾的地方看一遍哭一遍，照着上面的文字誊抄一段话出来的时候也是敲几个字流眼泪，敲几个字流眼泪……看完武动的这几天每天都去操场跑步，三公里四公里的，不然每到17点的那段时间结合17点半校园广播真的让人心中堵得慌。唉……

  </script>
  <script src="assets/marked.min.js"></script>
  <script>
(function () {
  const CONFIG = { textFile: '生活感悟.md' };

  marked.setOptions({
    breaks: true,
    gfm: true,
    headerIds: false,
    mangle: false,
    smartLists: true,
    smartypants: true
  });

  let categories = [];
  let expandedState = {};

  function shortenTitle(text, maxLen) {
    const line = (text || '').split(/\r?\n/)[0].trim();
    if (!line) return '未命名';
    return line.length > maxLen ? line.slice(0, maxLen) + '…' : line;
  }

  /** 小节标题用《》替换 << >>，仅用于展示 */
  function polishHeadingFragment(s) {
    return String(s || '')
      .replace(/<<\s*([^>]+?)\s*>>/g, '《$1》')
      .replace(/《\s+/g, '《')
      .replace(/\s+》/g, '》');
  }

  function literaryTagFromBlob(blob, firstLine) {
    var source = String(blob || '') + '\n' + String(firstLine || '');
    var rules = [
      { re: /武动|林动|冰主|祖境|轮回/, tag: '轮回寻你' },
      { re: /龙族|绘梨衣|路明非|Sakura|上杉/, tag: '雨落红井' },
      { re: /斗破|萧炎|云韵|药老|风尊者|云岚/, tag: '风起云岚' },
      { re: /直播间|大圣|天命人|黑神话|游戏/, tag: '大圣余烬' },
      { re: /歌单|耳机|情绪|感动|落泪|治愈/, tag: '灯下听歌' }
    ];
    for (var i = 0; i < rules.length; i++) {
      if (rules[i].re.test(source)) return rules[i].tag;
    }
    var cleaned = polishHeadingFragment(firstLine).replace(/^\d{4}\.\d{1,2}\.\d{1,2}\s*/, '').trim();
    if (!cleaned) return '长夜札记';
    var shorty = cleaned.split(/[，。、；：！？]/)[0].trim();
    return shorty ? shortenTitle(shorty, 8).replace(/…/, '') : '长夜札记';
  }

  /** 数字小节「. - …」收整后生成精炼标题（文学短号） */
  function sectionHeadingFromQuotes(sectionNum, quotes) {
    if (!quotes || quotes.length === 0) return sectionNum + '. 未命名';
    const blob = quotes
      .map(function (q) {
        return q.content;
      })
      .join('\n');
    const firstLine = quotes[0].content.split(/\r?\n/)[0].replace(/\s+/g, ' ').trim();
    const dateM = firstLine.match(/^(\d{4}\.\d{1,2}\.\d{1,2})/);
    const tag = literaryTagFromBlob(blob, firstLine);
    if (dateM) return sectionNum + '. ' + dateM[1] + ' · ' + tag;
    return sectionNum + '. ' + tag;
  }

  function flushCategory(parts, name, quotes, catIndex) {
    if (!name || quotes.length === 0) return;
    const catId = 'category-' + catIndex;
    let quotesHtml = '';
    quotes.forEach(function (quote) {
      const safeMd = quote.content.replace(/&gt;/g, '>');
      const rendered = marked.parse(safeMd).trim();
      quotesHtml +=
        '<div class="quote-item"><div class="quote-text">' +
        '<span class="quote-number">' + quote.num + '</span>' +
        '<div class="quote-content">' + rendered + '</div></div></div>';
    });
    parts.push(
      '<div class="category-section" id="section-' + catId + '">' +
        '<h2 class="category-title" id="title-' + catId + '" data-cat="' + catId + '">' +
        '<span>' + escapeHtml(name) + '</span>' +
        '<span class="toggle-hint">展开</span></h2>' +
        '<div class="quotes-container" id="' + catId + '">' + quotesHtml + '</div></div>'
    );
    categories.push({ name: name, id: catId });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function parseContent(text) {
    const lines = text.split(/\r?\n/);
    const htmlParts = [];
    categories = [];
    let currentCategory = '';
    let currentQuotes = [];
    let quoteCount = 0;
    let categoryCount = 0;

    function doFlush() {
      if (!currentCategory || currentQuotes.length === 0) return;
      var displayName = currentCategory;
      if (displayName.indexOf('__NUM__:') === 0) {
        displayName = sectionHeadingFromQuotes(displayName.slice(8), currentQuotes);
      }
      flushCategory(htmlParts, displayName, currentQuotes, categoryCount);
      categoryCount++;
      currentQuotes = [];
    }

    for (let i = 0; i < lines.length; i++) {
      const raw = lines[i];
      const trimmed = raw.replace(/\u00A0/g, ' ').replace(/^\s+|\s+$/g, '');

      if (!trimmed) {
        if (currentQuotes.length > 0) {
          const last = currentQuotes[currentQuotes.length - 1];
          if (last && last._building) last.content += '\n';
        }
        continue;
      }

      if (trimmed.match(/^#{1,2}\s/)) {
        doFlush();
        currentCategory = trimmed.replace(/^#{1,2}\s*/, '');
        continue;
      }

      const numberMatch = trimmed.match(/^(\d+)\.\s*(.*)$/);
      if (numberMatch) {
        doFlush();
        const num = numberMatch[1];
        let rest = numberMatch[2] || '';
        if (rest.trim().startsWith('-')) {
          const firstLine = rest.replace(/^[-*]\s*/, '').trim();
          let tempContent = firstLine;
          let j = i + 1;
          while (j < lines.length) {
            const look = lines[j];
            const lookTrim = look.replace(/\u00A0/g, ' ').trim();
            if (!lookTrim) {
              tempContent += '\n';
              j++;
              continue;
            }
            if (lookTrim.match(/^#{1,2}\s/)) break;
            if (lookTrim.match(/^(\d+)\.\s*/)) break;
            if (lookTrim.startsWith('---')) {
              j++;
              continue;
            }
            if (lookTrim.match(/^[-*]\s*/)) break;
            tempContent += '\n' + lines[j];
            j++;
          }
          tempContent = tempContent.replace(/&gt;/g, '>');
          if (tempContent.replace(/\s|&nbsp;|\u00A0/g, '') !== '') {
            currentCategory = '__NUM__:' + num;
            currentQuotes.push({ num: '1', content: tempContent, _building: false });
            quoteCount++;
            i = j - 1;
          } else {
            currentCategory = num + '. (空)';
          }
          continue;
        }
        if (rest.trim()) {
          currentCategory = num + '. ' + rest.trim();
        } else {
          currentCategory = '';
        }
        continue;
      }

      const dashMatch = trimmed.match(/^[-*]\s*(.*)$/);
      if (dashMatch && currentCategory) {
        let tempContent = dashMatch[1] || '';
        let j = i + 1;
        while (j < lines.length) {
          const look = lines[j];
          const lookTrim = look.replace(/\u00A0/g, ' ').trim();
          if (!lookTrim) {
            tempContent += '\n';
            j++;
            continue;
          }
          if (lookTrim.match(/^#{1,2}\s/)) break;
          if (lookTrim.match(/^(\d+)\.\s*/)) break;
          if (lookTrim.startsWith('---')) {
            j++;
            continue;
          }
          if (lookTrim.match(/^[-*]\s*/)) break;
          tempContent += '\n' + lines[j];
          j++;
        }
        tempContent = tempContent.replace(/&gt;/g, '>');
        if (tempContent.replace(/\s|&nbsp;|\u00A0/g, '') === '') {
          i = j - 1;
          continue;
        }
        const num = String(currentQuotes.length + 1);
        currentQuotes.push({ num: num, content: tempContent, _building: false });
        quoteCount++;
        i = j - 1;
        continue;
      }

      if (currentCategory && currentQuotes.length > 0) {
        currentQuotes[currentQuotes.length - 1].content += '\n' + raw;
      }
    }

    doFlush();

    const statsEl = document.getElementById('stats');
    if (statsEl) {
      statsEl.innerHTML =
        '共收录 <strong>' +
        categories.length +
        '</strong> 个主题，<strong>' +
        quoteCount +
        '</strong> 条段落';
    }

    generateTOC();
    return htmlParts.join('');
  }

  function generateTOC() {
    const tocList = document.getElementById('toc-list');
    if (!tocList) return;
    if (categories.length === 0) {
      tocList.innerHTML = '<li><span style="opacity:0.75">暂无目录</span></li>';
      return;
    }
    tocList.innerHTML = categories
      .map(function (cat) {
        return '<li><a href="#' + cat.id + '">' + escapeHtml(cat.name) + '</a></li>';
      })
      .join('');
  }

  function toggleCategory(categoryId) {
    const container = document.getElementById(categoryId);
    const title = document.getElementById('title-' + categoryId);
    if (!container || !title) return;
    const hint = title.querySelector('.toggle-hint');
    if (container.classList.contains('expanded')) {
      container.classList.remove('expanded');
      title.classList.remove('expanded');
      expandedState[categoryId] = false;
      if (hint) hint.textContent = '展开';
    } else {
      container.classList.add('expanded');
      title.classList.add('expanded');
      expandedState[categoryId] = true;
      if (hint) hint.textContent = '收起';
    }
  }

  function expandAll() {
    document.querySelectorAll('.quotes-container').forEach(function (el) {
      el.classList.add('expanded');
    });
    document.querySelectorAll('.category-title').forEach(function (el) {
      el.classList.add('expanded');
      const h = el.querySelector('.toggle-hint');
      if (h) h.textContent = '收起';
    });
    categories.forEach(function (cat) {
      expandedState[cat.id] = true;
    });
  }

  function collapseAll() {
    document.querySelectorAll('.quotes-container').forEach(function (el) {
      el.classList.remove('expanded');
    });
    document.querySelectorAll('.category-title').forEach(function (el) {
      el.classList.remove('expanded');
      const h = el.querySelector('.toggle-hint');
      if (h) h.textContent = '展开';
    });
    categories.forEach(function (cat) {
      expandedState[cat.id] = false;
    });
  }

  function updateActiveTOC() {
    const tocLinks = Array.from(document.querySelectorAll('#toc-list a'));
    let matched = false;
    categories.forEach(function (cat) {
      const section = document.getElementById('section-' + cat.id);
      if (!section) return;
      const rect = section.getBoundingClientRect();
      if (rect.top <= 120 && rect.bottom > 120) {
        tocLinks.forEach(function (a) {
          a.classList.toggle('active', a.getAttribute('href') === '#' + cat.id);
        });
        matched = true;
      }
    });
    if (!matched && tocLinks.length) {
      tocLinks.forEach(function (a) { a.classList.remove('active'); });
    }
  }

  function bindCategoryClicks() {
    document.querySelectorAll('.category-title[data-cat]').forEach(function (h2) {
      h2.addEventListener('click', function () {
        toggleCategory(h2.getAttribute('data-cat'));
      });
    });
  }

  function bindTocLinks() {
    document.querySelectorAll('#toc-list a').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        const id = a.getAttribute('href').slice(1);
        const container = document.getElementById(id);
        const title = document.getElementById('title-' + id);
        if (container && title) {
          container.classList.add('expanded');
          title.classList.add('expanded');
          const h = title.querySelector('.toggle-hint');
          if (h) h.textContent = '收起';
          expandedState[id] = true;
        }
        const sectionEl = document.getElementById('section-' + id);
        if (sectionEl) sectionEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  function applyRendered(html) {
    const contentDiv = document.getElementById('content');
    contentDiv.innerHTML = html;
    Object.keys(expandedState).forEach(function (catId) {
      if (expandedState[catId]) {
        const container = document.getElementById(catId);
        const title = document.getElementById('title-' + catId);
        if (container && title) {
          container.classList.add('expanded');
          title.classList.add('expanded');
          const h = title.querySelector('.toggle-hint');
          if (h) h.textContent = '收起';
        }
      }
    });
    bindCategoryClicks();
    bindTocLinks();
    updateActiveTOC();
  }

  const fileNote = document.getElementById('file-note');
  const mdPicker = document.getElementById('md-file');

  function embeddedMarkdown() {
    const node = document.getElementById('embedded-md');
    return node ? node.textContent : '';
  }

  function renderMarkdown(text, showNote) {
    if (!text || !text.trim()) return false;
    const html = parseContent(text);
    if (!html.trim()) return false;
    applyRendered(html);
    if (fileNote) fileNote.hidden = !showNote;
    return true;
  }

  async function readMarkdown() {
    const url = new URL(CONFIG.textFile, location.href);
    url.searchParams.set('t', Date.now());
    const response = await fetch(url, { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.text();
  }

  async function loadContent() {
    try {
      const text = await readMarkdown();
      if (!renderMarkdown(text, false)) throw new Error('内容为空或格式无法识别');
    } catch (error) {
      /* 双击打开（file://）时浏览器禁止 fetch 本地文件，退回内嵌快照 */
      if (location.protocol === 'file:' && renderMarkdown(embeddedMarkdown(), true)) return;
      document.getElementById('content').innerHTML =
        '<div class="error"><p>无法加载《' +
        escapeHtml(CONFIG.textFile) +
        '》（' +
        escapeHtml(error.message) +
        '）。</p><p style="margin-top:10px;font-size:0.9em;">请确认该文件与 index.html 在同一目录。</p></div>';
    }
  }

  if (mdPicker) {
    mdPicker.addEventListener('change', async function () {
      const file = mdPicker.files && mdPicker.files[0];
      if (!file) return;
      try {
        renderMarkdown(await file.text(), true);
      } catch (e) {}
      mdPicker.value = '';
    });
  }

  document.getElementById('expand-all').addEventListener('click', expandAll);
  document.getElementById('collapse-all').addEventListener('click', collapseAll);
  window.addEventListener('scroll', updateActiveTOC);
  window.addEventListener('resize', updateActiveTOC);

  /* ---------- 雷姆小助手：点击换台词，闲置 5 秒后隐藏 ---------- */
  /* 台词取自《Re:Zero》BD 日文字幕，时间码已核对 */
  const REM_LINES = [
    { jp: 'スバルくんは、レムの英雄なんです。', cn: '昴是雷姆的英雄。', ep: 'ep18 · 00:19:19' },
    { jp: 'レムがいます。スバルくんが救ってくれたレムが、今、ここにいます。', cn: '雷姆在。被昴救下的雷姆，此刻就在这里。', ep: 'ep18 · 00:21:24' },
    { jp: '1人で歩くのが大変なら、レムが支えます。', cn: '一个人走太辛苦的话，雷姆会扶着你。', ep: 'ep18 · 00:22:47' },
    { jp: 'レムの英雄が、笑って未来を迎えられるのなら。', cn: '只要雷姆的英雄能笑着迎接未来。', ep: 'ep18 · 00:24:49' },
    { jp: 'スバルくんに頭をなでられるのが好きです。', cn: '喜欢被昴摸头。', ep: 'ep18 · 00:17:25' },
    { jp: '世界中の誰もスバルくんを信じなくなっても、レムは信じています。', cn: '哪怕全世界都不信你，雷姆也相信你。', ep: 'ep18 · 00:20:44' },
    { jp: 'どうして、放っておいてくれなかったんですか。', cn: '为什么……没有丢下我不管呢。', ep: 'ep11 · 00:09:12' }
  ];
  const remAvatarBtn = document.getElementById('rem-avatar-btn');
  const mascotBubble = document.getElementById('mascot-bubble');
  let remLine = 0;
  let remTimer = null;

  function showRemLine(index) {
    if (!mascotBubble) return;
    remLine = (index + REM_LINES.length) % REM_LINES.length;
    const line = REM_LINES[remLine];
    mascotBubble.innerHTML = '<span class="jp"></span><span class="cn"></span><span class="ep"></span>';
    mascotBubble.querySelector('.jp').textContent = line.jp;
    mascotBubble.querySelector('.cn').textContent = line.cn;
    mascotBubble.querySelector('.ep').textContent = line.ep || '';
    mascotBubble.classList.remove('is-hidden');
    mascotBubble.setAttribute('aria-hidden', 'false');
    clearTimeout(remTimer);
    remTimer = setTimeout(function () {
      mascotBubble.classList.add('is-hidden');
      mascotBubble.setAttribute('aria-hidden', 'true');
    }, 5000);
  }

  showRemLine(0);
  if (remAvatarBtn) {
    remAvatarBtn.addEventListener('click', function () { showRemLine(remLine + 1); });
  }

  /* 热更新只在 http(s) 下有意义；file:// 直开时跳过，避免每 2 秒一次失败请求 */
  const LIVE = location.protocol === 'http:' || location.protocol === 'https:';
  let lastText = null;
  if (LIVE) setInterval(async function () {
    try {
      const t = await readMarkdown();
      if (lastText === null) lastText = t;
      else if (t !== lastText) {
        lastText = t;
        await loadContent();
      }
    } catch (e) {}
  }, 2000);

  document.addEventListener('DOMContentLoaded', function () {
    const jumpTop = document.getElementById('jump-top');
    const jumpBottom = document.getElementById('jump-bottom');
    if (jumpTop) {
      jumpTop.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
    if (jumpBottom) {
      jumpBottom.addEventListener('click', function () {
        const max = Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight
        );
        window.scrollTo({ top: max, behavior: 'smooth' });
      });
    }
    loadContent();
  });
})();
  </script>
